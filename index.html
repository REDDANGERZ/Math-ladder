<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪜 سُلَّم Math 100</title>

<style>
:root{
--bg: linear-gradient(135deg,#141E30,#243B55);
--card: rgba(255,255,255,0.1);
--text: #ffffff;
--button: linear-gradient(45deg,#ff9800,#ff5722);
--shadow: 0 8px 25px rgba(0,0,0,0.3);
}

.dark{
--bg: #0f0f0f;
--card: #1c1c1c;
--text: #eee;
--button: linear-gradient(45deg,#333,#555);
}

body{
margin:0;
font-family:'Segoe UI', Tahoma, sans-serif;
background:var(--bg);
color:var(--text);
text-align:center;
transition:0.4s;
}

.container{
padding:25px;
max-width:450px;
margin:auto;
}

h1{
font-size:24px;
margin-bottom:15px;
}

input{
width:85%;
padding:14px;
font-size:17px;
border-radius:14px;
border:none;
margin-bottom:12px;
box-shadow:var(--shadow);
}

button{
width:100%;
padding:14px;
font-size:18px;
border-radius:14px;
border:none;
background:var(--button);
color:white;
margin-top:10px;
cursor:pointer;
transition:0.3s;
box-shadow:var(--shadow);
}

button:hover{
transform:translateY(-3px);
opacity:0.9;
}

.quiz-option{
display:block;
background:var(--card);
padding:14px;
margin:10px 0;
border-radius:14px;
cursor:pointer;
text-align: right;
}

.hidden{display:none;}

.toggle{
background:none;
border:2px solid var(--text);
color:var(--text);
padding:8px;
margin-bottom:12px;
border-radius:10px;
font-size:14px;
cursor:pointer;
width: auto;
}

.toggle:hover{
background:var(--text);
color:black;
}
</style>
</head>
<body>

<div class="container">

<button class="toggle" onclick="toggleDark()">🌙 تبديل الوضع</button>

<h1>🪜 سلم الرياضيات  </h1>

<div id="home">
<p>أدخل مستوى التحدي (1 - 100)</p>
<input type="number" id="levelInput" min="1" max="100" placeholder="مثلاً: 75">
<button onclick="startLevel()">ابدأ التحدي</button>
</div>

<div id="lessonPage" class="hidden">
<h2 id="lessonTitle"></h2>
<div id="quiz"></div>
<p id="timerText">⏳ الوقت: 10</p>
<button onclick="checkAnswer()">تحقق من الإجابة</button>
</div>

</div>

<script>
const questions = [
    // 1-10: معادلات خطية بسيطة
    {q:"x + 4 = 9", options:[5,6,4,3], answer:5},
    {q:"x - 7 = 3", options:[10,9,8,6], answer:10},
    {q:"2x = 12", options:[6,5,4,8], answer:6},
    {q:"3x = 15", options:[5,6,4,3], answer:5},
    {q:"x ÷ 5 = 4", options:[20,15,25,10], answer:20},
    {q:"4x + 2 = 10", options:[2,3,4,1], answer:2},
    {q:"5x - 5 = 20", options:[5,4,6,3], answer:5},
    {q:"2x + 6 = 14", options:[4,3,5,6], answer:4},
    {q:"7x = 49", options:[7,6,8,9], answer:7},
    {q:"3x - 3 = 9", options:[4,3,5,6], answer:4},

    // 11-20: متباينات
    {q:"x + 3 > 7", options:["x>4","x<4","x=4","x≥4"], answer:"x>4"},
    {q:"x - 5 < 2", options:["x<7","x>7","x=7","x≥7"], answer:"x<7"},
    {q:"2x > 10", options:["x>5","x<5","x=5","x≥5"], answer:"x>5"},
    {q:"3x < 12", options:["x<4","x>4","x=4","x≥4"], answer:"x<4"},
    {q:"x/4 ≥ 3", options:["x≥12","x≤12","x=12","x>12"], answer:"x≥12"},
    {q:"5x ≤ 20", options:["x≤4","x≥4","x=4","x<4"], answer:"x≤4"},
    {q:"x+8 ≤ 10", options:["x≤2","x≥2","x=2","x<2"], answer:"x≤2"},
    {q:"2x-4 > 0", options:["x>2","x<2","x=2","x≥2"], answer:"x>2"},
    {q:"x-6 ≥ 3", options:["x≥9","x≤9","x=9","x>9"], answer:"x≥9"},
    {q:"4x < 16", options:["x<4","x>4","x=4","x≥4"], answer:"x<4"},

    // 21-30: فيثاغورس
    {q:"مثلث قائم ضلعاه 3 و4، الوتر؟", options:[5,6,7,4], answer:5},
    {q:"مثلث قائم ضلعاه 5 و12، الوتر؟", options:[13,14,15,12], answer:13},
    {q:"وتر 10 وأحد الضلعين 6، الضلع الآخر؟", options:[8,7,6,9], answer:8},
    {q:"مثلث قائم ضلعاه 8 و15، الوتر؟", options:[17,16,18,20], answer:17},
    {q:"وتر 25 وأحد الضلعين 7، الضلع الآخر؟", options:[24,20,18,22], answer:24},
    {q:"6² + 8² =", options:[100,90,80,70], answer:100},
    {q:"5² + 12² =", options:[169,144,150,130], answer:169},
    {q:"9² + 12² =", options:[225,200,180,250], answer:225},
    {q:"8² + 15² =", options:[289,300,250,275], answer:289},
    {q:"12² + 5² =", options:[169,150,180,144], answer:169},

    // 31-40: الجذور
    {q:"√25 =", options:[5,4,6,3], answer:5},
    {q:"√49 =", options:[7,6,8,9], answer:7},
    {q:"√81 =", options:[9,8,7,6], answer:9},
    {q:"√144 =", options:[12,10,14,16], answer:12},
    {q:"√169 =", options:[13,12,14,15], answer:13},
    {q:"√196 =", options:[14,12,16,18], answer:14},
    {q:"√225 =", options:[15,14,16,18], answer:15},
    {q:"√256 =", options:[16,18,14,20], answer:16},
    {q:"√400 =", options:[20,25,30,15], answer:20},
    {q:"√324 =", options:[18,16,20,22], answer:18},

    // 41-50: الأسس
    {q:"2³ × 2² =", options:[32,16,8,64], answer:32},
    {q:"5⁴ ÷ 5² =", options:[25,5,125,10], answer:25},
    {q:"3² × 3³ =", options:[243,27,81,9], answer:243},
    {q:"10³ ÷ 10¹ =", options:[100,1000,10,1], answer:100},
    {q:"4² × 4¹ =", options:[64,16,32,8], answer:64},
    {q:"2⁵ ÷ 2³ =", options:[4,8,16,2], answer:4},
    {q:"7² × 7¹ =", options:[343,49,98,21], answer:343},
    {q:"6³ ÷ 6² =", options:[6,36,12,18], answer:6},
    {q:"9² ÷ 9¹ =", options:[9,18,27,81], answer:9},
    {q:"8³ ÷ 8² =", options:[8,16,32,64], answer:8},

    // 51-60: التحليل
    {q:"x² + 5x =", options:["x(x+5)","(x+5)²","x²(5)","(x+5)(x-5)"], answer:"x(x+5)"},
    {q:"x² - 9 =", options:["(x-3)(x+3)","(x-9)(x+1)","x(x-9)","(x-3)²"], answer:"(x-3)(x+3)"},
    {q:"x² + 7x + 10 =", options:["(x+5)(x+2)","(x+10)(x-1)","(x+7)(x+3)","x(x+10)"], answer:"(x+5)(x+2)"},
    {q:"x² - 4 =", options:["(x-2)(x+2)","(x-4)(x+1)","x(x-4)","(x-2)²"], answer:"(x-2)(x+2)"},
    {q:"x² + 6x + 9 =", options:["(x+3)²","(x+9)(x-1)","x(x+9)","(x+6)²"], answer:"(x+3)²"},
    {q:"x² - 16 =", options:["(x-4)(x+4)","(x-8)(x+2)","x(x-16)","(x-4)²"], answer:"(x-4)(x+4)"},
    {q:"x² + 8x +16 =", options:["(x+4)²","(x+8)(x+2)","x(x+16)","(x+2)²"], answer:"(x+4)²"},
    {q:"x² - 25 =", options:["(x-5)(x+5)","(x-25)(x+1)","x(x-25)","(x-5)²"], answer:"(x-5)(x+5)"},
    {q:"x² + 9x + 20 =", options:["(x+4)(x+5)","(x+10)(x-1)","(x+9)(x+2)","x(x+20)"], answer:"(x+4)(x+5)"},
    {q:"x² - 36 =", options:["(x-6)(x+6)","(x-12)(x+3)","x(x-36)","(x-6)²"], answer:"(x-6)(x+6)"},

    // 61-70: مساحات ومحيطات
    {q:"مساحة مربع طول ضلعه 6؟", options:[36,24,12,30], answer:36},
    {q:"محيط مستطيل طوله 5 وعرضه 3؟", options:[16,15,8,10], answer:16},
    {q:"مساحة مثلث قاعدته 4 وارتفاعه 5؟", options:[10,20,9,15], answer:10},
    {q:"محيط دائرة نصف قطرها 7 (π=22/7)؟", options:[44,22,154,14], answer:44},
    {q:"مساحة دائرة نصف قطرها 7 (π=22/7)؟", options:[154,44,49,14], answer:154},
    {q:"مساحة متوازي أضلاع قاعدته 8 وارتفاعه 3؟", options:[24,11,22,16], answer:24},
    {q:"محيط مربع مساحته 25؟", options:[20,25,10,15], answer:20},
    {q:"مساحة معين طولا قطريه 6 و 8؟", options:[24,48,14,28], answer:24},
    {q:"حجم مكعب طول ضلعه 3؟", options:[27,9,12,18], answer:27},
    {q:"حجم متوازي مستطيلات (2×3×4)؟", options:[24,9,12,20], answer:24},

    // 71-80: زوايا وهندسة
    {q:"مجموع زوايا المثلث؟", options:[180,360,90,270], answer:180},
    {q:"مجموع زوايا الشكل الرباعي؟", options:[360,180,90,540], answer:360},
    {q:"زاوية مكملة للزاوية 70؟", options:[110,20,30,180], answer:110},
    {q:"زاوية متممة للزاوية 40؟", options:[50,140,90,60], answer:50},
    {q:"عدد أقطار الشكل الخماسي؟", options:[5,2,3,10], answer:5},
    {q:"الزاوية القائمة قياسها؟", options:[90,180,45,360], answer:90},
    {q:"المثلث متساوي الأضلاع زاوية الواحدة؟", options:[60,90,45,30], answer:60},
    {q:"عدد أضلاع السداسي؟", options:[6,5,8,4], answer:6},
    {q:"زاوية مستقيمة قياسها؟", options:[180,90,360,0], answer:180},
    {q:"مجموع زوايا الخماسي المنتظم؟", options:[540,360,720,180], answer:540},

    // 81-90: نسب مئوية وتناسب
    {q:"10% من 200؟", options:[20,10,2,40], answer:20},
    {q:"إذا كان 2x=10 فإن 3x=؟", options:[15,10,5,20], answer:15},
    {q:"تحويل 1/4 إلى نسبة مئوية؟", options:["25%","50%","75%","10%"], answer:"25%"},
    {q:"سعر سلعة 100 زاد 20%، السعر الجديد؟", options:[120,110,150,80], answer:120},
    {q:"نسبة 3 إلى 12 في أبسط صورة؟", options:["1:4","1:3","1:2","3:4"], answer:"1:4"},
    {q:"إذا كان x/4 = 3/2 فإن x=؟", options:[6,4,8,12], answer:6},
    {q:"75% من 80؟", options:[60,40,20,70], answer:60},
    {q:"اشترى بـ 80 وباع بـ 100، الربح؟", options:["25%","20%","15%","10%"], answer:"25%"},
    {q:"عدد البنات 12 والطلاب 20، نسبة البنات؟", options:["60%","40%","50%","30%"], answer:"60%"},
    {q:"40% من عدد هو 20، ما هو العدد؟", options:[50,40,80,100], answer:50},

    // 91-100: إحصاء واحتمالات
    {q:"المتوسط الحسابي لـ (2, 4, 6)؟", options:[4,3,12,6], answer:4},
    {q:"المنوال للقيم (3, 5, 3, 7)؟", options:[3,5,7,4], answer:3},
    {q:"الوسيط للقيم (1, 3, 7)؟", options:[3,1,7,4], answer:3},
    {q:"احتمال ظهور صورة عند رمي عملة؟", options:["1/2","1/4","1","0"], answer:"1/2"},
    {q:"احتمال ظهور الرقم 7 في حجر النرد؟", options:[0,1,"1/6","1/2"], answer:0},
    {q:"المدى للقيم (10, 2, 5, 8)؟", options:[8,10,2,5], answer:8},
    {q:"احتمال حدث مؤكد؟", options:[1,0,"1/2","100"], answer:1},
    {q:"المتوسط لـ (10, 20)؟", options:[15,30,10,25], answer:15},
    {q:"عدد النواتج لرمي حجر نرد واحد؟", options:[6,12,36,1], answer:6},
    {q:"الوسيط لـ (2, 4, 6, 8)؟", options:[5,4,6,10], answer:5}
];

let currentLevel=0;
let correctAnswer=0;
let timer;
let timeLeft = 10;

function toggleDark(){
    document.body.classList.toggle("dark");
}

function startTimer(){
    clearInterval(timer);
    timeLeft = 10;
    document.getElementById("timerText").innerText = "⏳ الوقت: " + timeLeft;

    timer = setInterval(()=>{
        timeLeft--;
        document.getElementById("timerText").innerText = "⏳ الوقت: " + timeLeft;

        if(timeLeft <= 0){
            clearInterval(timer);
            alert("⛔ انتهى الوقت! حاول مرة أخرى");
            goBackHome();
        }
    }, 1000);
}

function startLevel(){
    let level=Number(document.getElementById("levelInput").value);
    if(level < 1 || level > questions.length){
        alert("الرجاء إدخال مستوى بين 1 و 100");
        return;
    }
    currentLevel=level;
    document.getElementById("home").classList.add("hidden");
    document.getElementById("lessonPage").classList.remove("hidden");
    loadLesson(level);
}

function loadLesson(level){
    startTimer();
    document.getElementById("lessonTitle").innerText="المستوى "+level;

    const qObj = questions[level-1];
    correctAnswer = qObj.answer;

    const quiz=document.getElementById("quiz");
    quiz.innerHTML=`<p style="font-size:22px; margin:20px 0;">${qObj.q}</p>`;

    qObj.options.forEach(opt=>{
        quiz.innerHTML+=`
        <label class="quiz-option">
            <input type="radio" name="answer" value="${opt}">
            ${opt}
        </label>`;
    });
}

function checkAnswer(){
    const selected=document.querySelector('input[name="answer"]:checked');
    if(!selected){
        alert("يجب اختيار إجابة!");
        return;
    }

    clearInterval(timer);
    if(selected.value == correctAnswer.toString()){
        alert("✅ إجابة رائعة! لقد اجتزت المستوى " + currentLevel);
    }else{
        alert("❌ خطأ! الإجابة الصحيحة كانت: " );
    }
    goBackHome();
}

function goBackHome(){
    document.getElementById("lessonPage").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");
    document.getElementById("levelInput").value="";
}
</script>

</body>
</html>
