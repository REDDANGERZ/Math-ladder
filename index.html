<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪜Math & Ladder</title>

<style>
body{
margin:0;
font-family:'Segoe UI', Tahoma, sans-serif;
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
text-align:center;
}

.container{
padding:25px;
max-width:500px;
margin:auto;
}

input,button{
width:100%;
padding:14px;
font-size:18px;
border-radius:12px;
border:none;
margin-top:10px;
}

button{
background:linear-gradient(45deg,#ff9800,#ff5722);
color:white;
cursor:pointer;
}

.quiz-option{
display:block;
background:rgba(255,255,255,0.15);
padding:12px;
margin:8px 0;
border-radius:10px;
cursor:pointer;
}

.hidden{display:none;}
</style>
</head>
<body>

<div class="container">

<h1>🪜 Math & Ladder </h1>

<div id="home">
<p>أدخل رقم من 1 إلى 100</p>
<input type="number" id="levelInput" min="1" max="100">
<button onclick="startLevel()">ابدأ</button>
</div>

<div id="lessonPage" class="hidden">
<h2 id="lessonTitle"></h2>
<div id="quiz"></div>
<button onclick="checkAnswer()">تحقق</button>
</div>

</div>

<script>

let correctAnswer=0;

function startLevel(){
let level=Number(document.getElementById("levelInput").value);
if(level<1||level>100){
alert("أدخل رقم بين 1 و100");
return;
}
document.getElementById("home").classList.add("hidden");
document.getElementById("lessonPage").classList.remove("hidden");
loadLesson(level);
}

function loadLesson(level){

document.getElementById("lessonTitle").innerText="المرحلة "+level;

let question="";
let options=[];

/* 1–20 تبسيط */
if(level<=20){
let a=level+2;
let b=level%5+1;
correctAnswer=(a+b);
question=`بسط: ${a}x + ${b}x = ؟`;
options=[`${correctAnswer}x`,`${correctAnswer+1}x`,`${correctAnswer-1}x`,`${a*b}x`];
}

/* 21–40 معادلات خطية */
else if(level<=40){
let x=level%7+2;
let result=3*x+5;
correctAnswer=x;
question=`حل: 3x + 5 = ${result}`;
options=[x,x+1,x-1,x+2];
}

/* 41–60 توزيع */
else if(level<=60){
let a=level%6+2;
let b=level%4+1;
correctAnswer=2*a+2*b;
question=`بسط: 2(${a} + ${b}) = ؟`;
options=[correctAnswer,correctAnswer+2,correctAnswer-2,a+b];
}

/* 61–80 قوى */
else if(level<=80){
let base=level%5+2;
correctAnswer=base*base;
question=`احسب: ${base}² = ؟`;
options=[correctAnswer,base*3,base+base,correctAnswer+base];
}

/* 81–100 مسائل كلامية */
else{
let x=level%6+3;
let total=4*x;
correctAnswer=x;
question=`عدد إذا ضربناه في 4 يصبح ${total}. ما العدد؟`;
options=[x,x+1,x-1,x+2];
}

options.sort(()=>Math.random()-0.5);

const quiz=document.getElementById("quiz");
quiz.innerHTML=`<p>${question}</p>`;

options.forEach(opt=>{
quiz.innerHTML+=`
<label class="quiz-option">
<input type="radio" name="answer" value="${opt}">
${opt}
</label>`;
});
}

function checkAnswer(){
const selected=document.querySelector('input[name="answer"]:checked');
if(!selected){
alert("اختر إجابة");
return;
}

if(selected.value==correctAnswer){
alert("✅ صحيح!");
}else{
alert("❌ حاول مرة أخرى");
}

document.getElementById("lessonPage").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
document.getElementById("levelInput").value="";
}

</script>

</body>
</html>
