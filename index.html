function startTimer(){
    clearInterval(timer);
    timeLeft = 10;
    
    document.getElementById("timerText").innerText = "⏳ الوقت: " + timeLeft;
    
    // تشغيل الصوت مع معالجة خطأ "التفاعل الأول"
    sound.currentTime = 0;
    sound.play().catch(e => console.log("الصوت يحتاج لتفاعل لبدء التشغيل"));

    timer = setInterval(()=>{
        timeLeft--;
        document.getElementById("timerText").innerText = "⏳ الوقت: " + timeLeft;

        if(timeLeft <= 0){
            clearInterval(timer);
            sound.pause();
            alert("⛔ انتهى الوقت! حاول مجدداً");
            goBackHome();
        }
    }, 1000);
}

function startLevel(){
    let inputVal = document.getElementById("levelInput").value;
    let level = Number(inputVal);
    
    if(level < 1 || level > questions.length){
        alert("الرجاء إدخال رقم بين 1 و " + questions.length);
        return;
    }
    
    currentLevel = level;
    document.getElementById("home").classList.add("hidden");
    document.getElementById("lessonPage").classList.remove("hidden");
    loadLesson(level);
}

function loadLesson(level){
    document.getElementById("lessonTitle").innerText = "التحدي رقم " + level;
    const qObj = questions[level-1];
    correctAnswer = qObj.answer;

    const quiz = document.getElementById("quiz");
    quiz.innerHTML = `<p style="font-size:22px; margin:20px 0; font-weight:bold;">${qObj.q}</p>`;

    qObj.options.forEach(opt => {
        quiz.innerHTML += `
        <label class="quiz-option">
            <input type="radio" name="answer" value="${opt}">
            <span>${opt}</span>
        </label>`;
    });

    startTimer();
}

function checkAnswer(){
    const selected = document.querySelector('input[name="answer"]:checked');

    if(!selected){
        alert("اختر إجابة أولاً!");
        return;
    }

    clearInterval(timer);
    sound.pause();

    if(selected.value == correctAnswer.toString()){
        alert("✅ بطل! إجابة صحيحة.");
        let next = currentLevel + 1;
        if(next <= questions.length) {
            document.getElementById("levelInput").value = next;
            startLevel();
        } else {
            alert("تهانينا! ختمت الـ 100 سؤال!");
            goBackHome();
        }
    } else {
        alert("❌ خطأ! الإجابة الصحيحة هي: " + correctAnswer);
        goBackHome();
    }
}

function goBackHome(){
    clearInterval(timer);
    sound.pause();
    document.getElementById("lessonPage").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");
    document.getElementById("levelInput").value = "";
}
</script>
</body>
</html>
