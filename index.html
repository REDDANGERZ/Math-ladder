<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪜 سُلَّم Math</title>

<style>
:root{
--bg: linear-gradient(135deg,#141E30,#243B55);
--card: rgba(255,255,255,0.1);
--text: #ffffff;
--button: linear-gradient(45deg,#ff9800,#ff5722);
--progress: linear-gradient(90deg,#00e676,#00c853);
--shadow: 0 8px 25px rgba(0,0,0,0.3);
}

.dark{
--bg: #0f0f0f;
--card: #1c1c1c;
--text: #eee;
--button: linear-gradient(45deg,#333,#555);
--progress: linear-gradient(90deg,#00c853,#009624);
}

body{
margin:0;
font-family:'Segoe UI', Tahoma, sans-serif;
background:var(--bg);
color:var(--text);
text-align:center;
transition:0.4s;
animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

.container{
padding:25px;
max-width:450px;
margin:auto;
}

h1{
font-size:24px;
margin-bottom:15px;
letter-spacing:1px;
}

input{
width:100%;
padding:14px;
font-size:18px;
border-radius:14px;
border:none;
margin-bottom:12px;
box-shadow:var(--shadow);
}

button{
width:100%;
padding:14px;
font-size:18px;
border-radius:14px;
border:none;
background:var(--button);
color:white;
margin-top:10px;
cursor:pointer;
transition:0.3s;
box-shadow:var(--shadow);
}

button:hover{
transform:translateY(-3px);
opacity:0.9;
}

button:active{
transform:scale(0.97);
}

.quiz-option{
display:block;
background:var(--card);
backdrop-filter:blur(10px);
padding:14px;
margin:10px 0;
border-radius:14px;
cursor:pointer;
transition:0.3s;
border:2px solid transparent;
}

.quiz-option:hover{
transform:scale(1.03);
border-color:#ffffff55;
}

.quiz-option input{
margin-left:8px;
}

.hidden{display:none;}

.progress-bar{
width:100%;
background:#ffffff22;
border-radius:25px;
height:18px;
margin-top:20px;
overflow:hidden;
box-shadow:var(--shadow);
}

.progress-fill{
height:100%;
background:var(--progress);
width:0%;
transition:0.5s;
}

#circles{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:6px;
margin-top:20px;
}

.circle{
width:100%;
aspect-ratio:1/1;
border-radius:50%;
background:#666;
transition:0.3s;
}

.circle:hover{
transform:scale(1.2);
}

.done{
background:linear-gradient(45deg,#00e676,#00c853);
box-shadow:0 0 10px #00e676;
}

.toggle{
background:none;
border:2px solid var(--text);
color:var(--text);
padding:8px;
margin-bottom:12px;
border-radius:10px;
font-size:14px;
cursor:pointer;
transition:0.3s;
}

.toggle:hover{
background:var(--text);
color:black;
    }

</style>
</head>
<body>

<div class="container">

<button class="toggle" onclick="toggleDark()">🌙 تبديل الوضع</button>

<h1>🪜 سُلَّم Math</h1>

<div id="home">
<p>أدخل رقم من 1 إلى 100</p>
<input type="number" id="levelInput" min="1" max="100">
<button onclick="startLevel()">ابدأ</button>
</div>

<div id="lessonPage" class="hidden">
<h2 id="lessonTitle"></h2>
<p id="lessonText"></p>
<div id="quiz"></div>
<button onclick="checkAnswer()">تحقق</button>
<button onclick="goHome()">رجوع</button>
</div>

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>

<div id="circles"></div>

</div>

<script>

let currentLevel=0;
let correctAnswer=0;

/* 🌙 وضع ليلي */
function toggleDark(){
document.body.classList.toggle("dark");
localStorage.setItem("darkMode",
document.body.classList.contains("dark"));
}

if(localStorage.getItem("darkMode")==="true"){
document.body.classList.add("dark");
}

/* 🎯 المراحل */
function startLevel(){
let level=Number(document.getElementById("levelInput").value);
if(level<1||level>100){
alert("أدخل رقم بين 1 و100");
return;
}
currentLevel=level;
document.getElementById("home").classList.add("hidden");
document.getElementById("lessonPage").classList.remove("hidden");
loadLesson(level);
}

function loadLesson(level){

document.getElementById("lessonTitle").innerText="المرحلة "+level;

let question="";
let options=[];

if(level<=50){
let a=level;
correctAnswer=a+5;
question=`احسب: ${a}+5`;
options=[correctAnswer,correctAnswer+1,correctAnswer-1,correctAnswer+2];
document.getElementById("lessonText").innerText="جمع";
}else{
let x=(level%5)+1;
let result=3*x+2;
correctAnswer=x;
question=`حل: 3x+2=${result}`;
options=[x,x+1,x+2,x-1];
document.getElementById("lessonText").innerText="معادلات";
}

const quiz=document.getElementById("quiz");
quiz.innerHTML=`<p>${question}</p>`;
options.forEach(opt=>{
quiz.innerHTML+=`
<label class="quiz-option">
<input type="radio" name="answer" value="${opt}">
${opt}
</label>`;
});
}

function checkAnswer(){
const selected=document.querySelector('input[name="answer"]:checked');
if(!selected){
alert("اختر إجابة");
return;
}
if(Number(selected.value)==correctAnswer){
localStorage.setItem("level_"+currentLevel,"done");
updateCircles();
alert("✅ صحيح!");
}else{
alert("❌ حاول مرة أخرى");
}
}

function goHome(){
document.getElementById("lessonPage").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}

function updateCircles(){
const container=document.getElementById("circles");
container.innerHTML="";
let completed=0;

for(let i=1;i<=100;i++){
let c=document.createElement("div");
c.classList.add("circle");
if(localStorage.getItem("level_"+i)){
c.classList.add("done");
completed++;
}
container.appendChild(c);
}

let percent=(completed/100)*100;
document.getElementById("progressFill").style.width=percent+"%";

if(completed===100){
alert("🎉 أكمل في دورتك القادمة");
}
}

updateCircles();

</script>

</body>
</html>
